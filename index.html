<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<title>Givre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0a0e15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: une seule colonne de téléphone, héros "Jour X" centré, barre d'onglets en bas */
:root{
  --bg:#0a0e15; --surface:#121925; --surface-2:#1a2332; --line:#243046;
  --fg:#eaf0f8; --muted:#8996ab; --ice:#8fdcff; --ice-strong:#4cc3ff;
  --flame-a:#ffb020; --flame-b:#ff5a1f; --ok:#34d399; --frost:#38bdf8;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --display:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef3f8; --surface:#ffffff; --surface-2:#f3f6fa; --line:#dbe3ee;
    --fg:#0f1a2a; --muted:#5d6b80; --ice:#0b8fd8; --ice-strong:#0077c2;
    --shadow:0 8px 24px rgba(20,40,70,.10); color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eef3f8; --surface:#ffffff; --surface-2:#f3f6fa; --line:#dbe3ee;
  --fg:#0f1a2a; --muted:#5d6b80; --ice:#0b8fd8; --ice-strong:#0077c2;
  --shadow:0 8px 24px rgba(20,40,70,.10); color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 60% at 50% -10%, color-mix(in oklab,var(--ice) 14%,transparent), transparent 60%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px;border-radius:10px}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-top:12px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.view{display:flex;flex-direction:column;gap:22px}
.section{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.brand{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand svg{width:20px;height:20px;color:var(--ice)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.icon-btn svg{width:20px;height:20px}

/* Héros */
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0 4px}
.ring-wrap{position:relative;width:min(232px,64vw);aspect-ratio:1;max-width:100%}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{stroke:var(--line);fill:none}
.ring-fg{fill:none;stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-center .k{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ring-center .n{font-family:var(--display);font-weight:800;font-size:clamp(56px,17vw,76px);line-height:1;font-variant-numeric:tabular-nums}
.ring-center .of{font-family:var(--display);font-size:16px;color:var(--muted);font-weight:600}
.ring-center .arc{font-size:13px;margin-top:6px;color:var(--ice);font-weight:600}
.streak{display:inline-flex;align-items:center;gap:8px;padding:8px 16px 8px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-family:var(--display);font-weight:700;font-size:17px}
.streak svg{width:26px;height:26px}
.streak.off{color:var(--muted)}
.streak small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%;max-width:340px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:600}
.wd i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:block;position:relative}
.wd.full i{background:linear-gradient(135deg,var(--flame-a),var(--flame-b));border-color:transparent}
.wd.part i{border-color:var(--ice);background:color-mix(in oklab,var(--ice) 22%,transparent)}
.wd.today{color:var(--fg)}
.wd.today i{box-shadow:0 0 0 3px color-mix(in oklab,var(--ice) 35%,transparent)}
.wd.future i{opacity:.45}

.daybar{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar>b{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--ice-strong),var(--ice));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.count{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}

/* Tâches */
.tasks{display:flex;flex-direction:column;gap:10px}
.task{--c:#3b82f6;position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:16px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);
  transition:transform .18s ease, border-color .3s ease, box-shadow .3s ease;user-select:none;-webkit-user-select:none}
.task:active{transform:scale(.985)}
.task .fill{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,var(--c),color-mix(in oklab,var(--c) 62%,#000));
  clip-path:circle(0% at var(--x,90%) var(--y,50%));transition:clip-path .55s cubic-bezier(.3,.7,.2,1)}
.task .fill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.28) 48%,transparent 66%);transform:translateX(-120%)}
.task.done .fill{clip-path:circle(150% at var(--x,90%) var(--y,50%))}
.task.done.shine .fill::after{animation:shine .9s .15s ease-out}
@keyframes shine{to{transform:translateX(120%)}}
.task.done{border-color:transparent;box-shadow:0 8px 24px color-mix(in oklab,var(--c) 35%,transparent)}
.task .ico{position:relative;z-index:1;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none;
  background:color-mix(in oklab,var(--c) 18%,transparent);transition:background .3s}
.task.done .ico{background:rgba(255,255,255,.18)}
.task .txt{position:relative;z-index:1;min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.task .name{font-weight:600;font-size:16px;transition:color .3s}
.task .sub{font-size:12.5px;color:var(--muted);transition:color .3s}
.task.done .name{color:#fff}
.task.done .sub{color:rgba(255,255,255,.82)}
.check{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:all .3s}
.check svg{width:18px;height:18px;stroke:var(--c);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .2s ease}
.task.done .check{background:#fff;border-color:#fff;transform:scale(1.05)}
.task.done .check svg{stroke-dashoffset:0}
.task.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(.96)}70%{transform:scale(1.025)}100%{transform:scale(1)}}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);align-self:flex-start}
.task.done .tag{background:rgba(255,255,255,.2);color:#fff}

/* Cartes génériques */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;font-weight:600;
  background:var(--fg);color:var(--bg)}
.btn.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:#f87171;border:1px solid color-mix(in oklab,#f87171 40%,transparent)}
.btn.small{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.link{color:var(--ice);font-weight:600;font-size:14px}

.photo-card{display:flex;align-items:center;gap:14px}
.photo-thumb{width:58px;height:58px;border-radius:14px;flex:none;display:grid;place-items:center;background:var(--surface-2);border:1px dashed var(--line);overflow:hidden;position:relative}
.photo-thumb svg{width:24px;height:24px;color:var(--muted)}
.photo-thumb.taken{border-style:solid;background:linear-gradient(135deg,color-mix(in oklab,var(--ice) 35%,var(--surface-2)),var(--surface-2))}
.photo-thumb.taken svg{color:var(--fg)}

/* Défis */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.tabs button{min-height:40px;border-radius:10px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);box-shadow:0 1px 0 var(--line)}
.ch{--c:#3b82f6;display:flex;gap:14px;align-items:flex-start}
.ch .ico{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:24px;background:color-mix(in oklab,var(--c) 20%,transparent)}
.ch .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ch h3{font-size:16.5px}
.ch p{margin:0;font-size:13.5px;color:var(--muted)}
.grid30{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:6px}
.grid30 i{aspect-ratio:1;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.grid30 i.d{background:var(--c);border-color:transparent}
.grid30 i.t{box-shadow:0 0 0 2px color-mix(in oklab,var(--c) 60%,transparent)}
.prog-card{position:relative;overflow:hidden}
.prog-card::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in oklab,var(--c) 22%,transparent),transparent 60%);pointer-events:none}
.prog-card>*{position:relative}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:4px 9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.pill{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:color-mix(in oklab,var(--c,var(--ice)) 22%,transparent);color:var(--fg)}

/* Progrès */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px}
.stat .v{font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.cal button{aspect-ratio:1;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .full{background:linear-gradient(135deg,var(--flame-a),var(--flame-b));border-color:transparent;color:#fff}
.cal .part{background:color-mix(in oklab,var(--ice) 30%,var(--surface-2));border-color:transparent;color:var(--fg)}
.cal .miss{background:transparent;border-style:dashed}
.cal .today{box-shadow:0 0 0 2px var(--ice)}
.cal .future{opacity:.4;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Menus, images, gels */
.ico img,.e img,.ico-sm img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.ico,.e{overflow:hidden}
.chip img{width:16px;height:16px;border-radius:4px;object-fit:cover;vertical-align:-3px;display:inline-block}
.ico-sm{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:21px;overflow:hidden;background:color-mix(in oklab,var(--c) 20%,transparent)}
.prog-item{flex-direction:row;align-items:flex-start;padding:0}
.ch-main{flex:1;min-width:0;display:flex;gap:14px;align-items:flex-start;text-align:left;padding:16px 0 16px 16px}
.more{flex:none;width:40px;height:40px;margin:8px 8px 0 0;border-radius:12px;display:grid;place-items:center;font-size:20px;font-weight:700;line-height:1;color:var(--muted);letter-spacing:1px}
.more:hover,.more:focus-visible{background:var(--surface-2);color:var(--fg)}
.card.ch{flex-direction:row}
.card.ch>.more{margin:-6px -6px 0 0}
.ch>.more{margin:-6px -6px 0 0}
.gel-card{background:color-mix(in oklab,var(--frost) 14%,var(--surface));border-color:color-mix(in oklab,var(--frost) 40%,var(--line));gap:8px}
.gel-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:color-mix(in oklab,var(--frost) 25%,transparent);flex:none}
.cal .frozen{background:var(--frost);border-color:transparent;color:#fff;font-size:11px}
.wd.frozen i{background:var(--frost);border-color:transparent}
.gel-won{position:relative;font-weight:700;padding:8px 14px;border-radius:99px;background:color-mix(in oklab,var(--frost) 30%,transparent);border:1px solid var(--frost)}

/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(12px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));
  background:color-mix(in oklab,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;font-size:11.5px;font-weight:600;color:var(--muted)}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"] svg{color:var(--ice)}

/* Feuilles */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,8,14,.55);opacity:0;transition:opacity .25s}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow:auto;background:var(--bg);border-top:1px solid var(--line);
  border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
.sheet-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 4px}
.sheet h2{font-size:22px}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.field textarea{min-height:90px;resize:vertical}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{aspect-ratio:1;border-radius:11px;font-size:21px;background:var(--surface);border:1px solid var(--line)}
.emojis button[aria-pressed="true"]{border-color:var(--ice);background:color-mix(in oklab,var(--ice) 18%,var(--surface))}
.colors{display:flex;flex-wrap:wrap;gap:10px}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.colors button[aria-pressed="true"]{border-color:var(--fg)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.li .e{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:19px;flex:none}
.li .t{flex:1;min-width:0;font-weight:600}
.li .mv{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.li .mv svg{width:16px;height:16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.seg button{min-height:40px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.switch{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"]{background:var(--ice-strong)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.confirm{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;border:1px solid color-mix(in oklab,#f87171 40%,transparent);background:color-mix(in oklab,#f87171 8%,var(--surface))}

/* Célébration */
.fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.shard{position:fixed;width:9px;height:9px;transform:rotate(45deg);border-radius:2px;will-change:transform,opacity}
.celebrate{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
  background:radial-gradient(80% 60% at 50% 45%,color-mix(in oklab,var(--flame-b) 30%,var(--bg)),var(--bg));opacity:0;transition:opacity .35s}
.celebrate.open{opacity:1}
.celebrate canvas{position:absolute;inset:0;width:100%;height:100%}
.celebrate .big{position:relative;font-family:var(--display);font-weight:800;font-size:44px;line-height:1.05}
.celebrate .flame{position:relative;width:120px;height:120px;animation:flameIn .9s cubic-bezier(.3,1.5,.5,1)}
.celebrate .num{position:relative;font-family:var(--display);font-weight:800;font-size:22px}
.celebrate p{position:relative;margin:0;color:var(--muted)}
@keyframes flameIn{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.toast{pointer-events:none;position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-20px);z-index:80;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:all .25s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;padding:24px 12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gallery div{aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;position:relative}
.gallery img{width:100%;height:100%;object-fit:cover}
.gallery span{position:absolute;left:6px;bottom:5px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.lock{filter:blur(14px) saturate(.6)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4cc3ff"/><stop offset="1" stop-color="#b6ecff"/></linearGradient>

/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2,'0');
const keyOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const todayKey = () => keyOf(new Date());
const addDays = (k,n) => { const d=parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const diffDays = (a,b) => Math.round((Date.UTC(...ymd(b))-Date.UTC(...ymd(a)))/864e5);
function ymd(k){ const [y,m,d]=k.split('-').map(Number); return [y,m-1,d]; }
const DOW = ['D','L','M','M','J','V','S'];
const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const DAYS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const niceDate = k => { const d=parseKey(k); return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]; };

/* ---------- Données par défaut ---------- */

const uid = () => Math.random().toString(36).slice(2,9);

const PROGRAMS = [

function defaultPrograms(){
  return PROGRAMS.map(p=>({id:uid(),name:p.name,emoji:p.emoji,color:p.color,desc:p.desc,days:90,
    rules:p.rules.map(([name,icon,color])=>({id:uid(),name,icon,color}))}));
}
const cloneRules = rs => rs.map(r=>({id:uid(),name:r.name,icon:r.icon,color:r.color}));
function arcFromProgram(p){
  return {id:uid(),progId:p.id,name:p.name,emoji:p.emoji,color:p.color,days:p.days||90,start:todayKey(),rules:cloneRules(p.rules)};
}
function freshState(){
  const t = todayKey();
  const programs = defaultPrograms();
  const cat = CATALOG.map(([name,icon,color,desc])=>({id:uid(),name,icon,color,desc,start:null}));
  cat[0].start = t; // Planche déjà lancée pour montrer le fonctionnement
  return {
    v:1, theme:'dark', name:'', haptics:true, sound:true,
    programs, arc:arcFromProgram(programs[0]),
    pastArcs:[], challenges:cat, log:{}, frozen:{}
  };
}
function migrate(){
  if(!S.programs) S.programs=defaultPrograms();
  if(!S.frozen) S.frozen={};
}

/* ---------- Stockage ---------- */
const LS_KEY='givre.v1';
let S;
function load(){
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ S=JSON.parse(raw); if(S&&S.v===1){ migrate(); return; } } }catch(e){}
  S=freshState(); save();
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

// Photos : IndexedDB, avec repli en mémoire
const mem = {};
let dbp=null;
function db(){
  if(dbp) return dbp;
  dbp = new Promise((res)=>{
    try{
      const r = indexedDB.open('givre-photos',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('p');
      r.onsuccess=()=>res(r.result); r.onerror=()=>res(null);
    }catch(e){ res(null); }
  });
  return dbp;
}
async function putPhoto(key,data){
  mem[key]=data;
  const d=await db(); if(!d) return;
  try{ d.transaction('p','readwrite').objectStore('p').put(data,key); }catch(e){}
}
async function getPhoto(key){
  if(mem[key]) return mem[key];
  const d=await db(); if(!d) return null;
  return new Promise(res=>{ try{ const r=d.transaction('p').objectStore('p').get(key); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null);}catch(e){res(null);} });
}

/* ---------- Logique ---------- */
const arcEnd = a => addDays(a.start, a.days-1);
function arcDay(k){ const a=S.arc; if(!a) return 0; return diffDays(a.start,k)+1; }
function inArc(k){ const a=S.arc; return !!a && k>=a.start && k<=arcEnd(a); }
function chActive(c,k){ return !!c.start && k>=c.start && diffDays(c.start,k)<30; }
function tasksFor(k){
  const out=[];
  if(inArc(k)) S.arc.rules.forEach(r=>out.push({key:'r:'+r.id, name:r.name, icon:r.icon, color:r.color, kind:'rule'}));
  S.challenges.forEach(c=>{ if(chActive(c,k)) out.push({key:'c:'+c.id, name:c.name, icon:c.icon, color:c.color, kind:'ch', day:diffDays(c.start,k)+1}); });
  return out;
}
function dayInfo(k){
  const L=S.log[k]||{};
  const req = (k===todayKey() || !L.req) ? tasksFor(k).map(t=>t.key) : L.req;
  const done = req.filter(x=>L.done&&L.done[x]).length;
  const full = req.length>0&&done===req.length;
  return {total:req.length, done, full, part:done>0&&done<req.length, frozen:!full && !!(S.frozen&&S.frozen[k])};
}
const okDay = k => { const d=dayInfo(k); return d.full||d.frozen; };
function firstKey(){
  const ks=Object.keys(S.log).concat(Object.keys(S.frozen||{}));
  if(S.arc) ks.push(S.arc.start);
  return ks.filter(k=>k<=todayKey()).sort()[0] || todayKey();
}
// Un gel gagné à chaque tranche de 10 journées complètes d'affilée (un jour gelé ne casse pas la suite)
function earnedGels(){
  const t=todayKey(); let k=firstKey(), run=0, earned=0;
  for(let i=0;i<3000 && k<=t;i++){
    const d=dayInfo(k);
    if(d.full){ run++; if(run%10===0) earned++; }
    else if(d.frozen){}
    else if(k!==t) run=0;
    k=addDays(k,1);
  }
  return earned;
}
const usedGels = () => Object.keys(S.frozen||{}).filter(k=>!dayInfo(k).full).length;
const gelsLeft = () => Math.max(0, earnedGels()-usedGels());
function toNextGel(){
  const t=todayKey(); let k=firstKey(), run=0;
  for(let i=0;i<3000 && k<=t;i++){ const d=dayInfo(k); if(d.full) run++; else if(!d.frozen && k!==t) run=0; k=addDays(k,1); }
  return 10-(run%10);
}
function isDone(k,key){ const L=S.log[k]; return !!(L&&L.done&&L.done[key]); }
function setDone(k,key,val){
  const L=S.log[k]||(S.log[k]={done:{}});
  L.done=L.done||{};
  if(val) L.done[key]=1; else delete L.done[key];
  L.req = tasksFor(k).map(t=>t.key);
  save();
}
function streak(){
  let n=0, k=todayKey();
  if(okDay(k)) n++;
  k=addDays(k,-1);
  for(let i=0;i<3000;i++){ if(okDay(k)){n++; k=addDays(k,-1);} else break; }
  return n;
}
function bestStreak(){
  const t=todayKey(); let k=firstKey(), cur=0, best=0;
  for(let i=0;i<3000 && k<=t;i++){ if(okDay(k)){ cur++; best=Math.max(best,cur); } else if(k!==t) cur=0; k=addDays(k,1); }
  return best;
}

/* ---------- Retours sensoriels ---------- */
function buzz(p){ if(S.haptics && navigator.vibrate){ try{navigator.vibrate(p);}catch(e){} } }
let actx=null;
function tink(up){
  if(!S.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime, notes = up ? [1318.5,1975.5] : [880];
    notes.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*.07); g.gain.exponentialRampToValueAtTime(.12,t+i*.07+.01); g.gain.exponentialRampToValueAtTime(.0001,t+i*.07+.35);
      o.connect(g).connect(actx.destination); o.start(t+i*.07); o.stop(t+i*.07+.4);
    });
  }catch(e){}
}
const reduce = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function shards(x,y,color){
  if(reduce()) return;
  const fx=document.getElementById('fx');
  for(let i=0;i<16;i++){
    const s=document.createElement('i'); s.className='shard';
    s.style.left=x+'px'; s.style.top=y+'px';
    s.style.background = i%3===0 ? '#ffffff' : color;
    const sz = 5+Math.random()*7; s.style.width=s.style.height=sz+'px';
    fx.appendChild(s);
    const a=Math.random()*Math.PI*2, d=40+Math.random()*70;
    const anim = s.animate([
      {transform:'translate(-50%,-50%) rotate(45deg) scale(1)',opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d}px)) rotate(${180+Math.random()*180}deg) scale(.2)`,opacity:0}
    ],{duration:600+Math.random()*300,easing:'cubic-bezier(.2,.8,.3,1)'});
    anim.onfinish=()=>s.remove();
  }
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200);
}
function celebrate(gained){
  const n=streak();
  const el=document.createElement('div'); el.className='celebrate'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Journée validée');
  el.innerHTML=`<canvas></canvas><div class="flame">${flameSVG(true)}</div><div class="big">Journée<br>validée</div>
    <div class="num">${n} jour${n>1?'s':''} de série</div>
    ${gained?`<div class="gel-won">❄️ +1 gel de série gagné</div>`:''}<p>Touche l'écran pour continuer</p>`;
  document.body.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('open'));
  buzz([30,60,30,60,80]);
  const cv=el.querySelector('canvas'), cx=cv.getContext('2d');
  let W,H,parts=[],raf;
  function size(){ W=cv.width=innerWidth*devicePixelRatio; H=cv.height=innerHeight*devicePixelRatio; }
  size();
  if(!reduce()){
    for(let i=0;i<90;i++) parts.push({x:Math.random()*W,y:-Math.random()*H,r:(2+Math.random()*4)*devicePixelRatio,v:(1+Math.random()*2.5)*devicePixelRatio,w:Math.random()*6,c:Math.random()<.5?'#ffffff':(Math.random()<.5?'#8fdcff':'#ffb020')});
    (function loop(){
      cx.clearRect(0,0,W,H);
      parts.forEach(p=>{ p.y+=p.v; p.w+=.03; p.x+=Math.sin(p.w)*.8; if(p.y>H+10){p.y=-10;p.x=Math.random()*W;}
        cx.save(); cx.translate(p.x,p.y); cx.rotate(p.w); cx.fillStyle=p.c; cx.globalAlpha=.85; cx.fillRect(-p.r/2,-p.r/2,p.r,p.r); cx.restore(); });
      raf=requestAnimationFrame(loop);
    })();
  }
  const close=()=>{ cancelAnimationFrame(raf); el.classList.remove('open'); setTimeout(()=>el.remove(),350); };
  el.addEventListener('click',close);
  setTimeout(close,5000);
}

const isImg = v => typeof v==='string' && v.startsWith('data:image');
const icon = v => isImg(v) ? `<img src="${v}" alt="">` : esc(v);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    <button class="icon-btn" data-act="settings" aria-label="Réglages">${I.gear}</button></div>`;

function viewToday(){
  const k=todayKey(), a=S.arc;
  const tasks=tasksFor(k);
  const st=streak();
  let hero;
  if(a && inArc(k)){
    hero=`<div class="ring-wrap">
      <svg viewBox="0 0 200 200"><circle class="ring-bg" cx="100" cy="100" r="88" stroke-width="10"/><circle class="ring-fg" id="ring" cx="100" cy="100" r="88" stroke-width="10" stroke-dasharray="552.9" stroke-dashoffset="552.9"/></svg>
      <div class="ring-center"><span class="k">Jour</span><span class="n">${arcDay(k)}</span><span class="of">sur ${a.days}</span><span class="arc">${esc(a.emoji)} ${esc(a.name)}</span></div></div>`;
  } else if(a && k>arcEnd(a)){

  return `<div class="view">${topbar()}

      ${week}
    </section>
    <section class="section">
      <div class="section-head"><h2 style="font-size:20px">Aujourd'hui</h2><span class="muted" style="font-size:13px">${niceDate(k)}</span></div>

      <div class="tasks" id="tasks">${list}</div>
    </section>
    ${a && inArc(k) ? photoCard(k) : ''}
  </div>`;
}
function weekStrip(k){
  const d=parseKey(k), dow=(d.getDay()+6)%7; // lundi=0
  const mon=addDays(k,-dow);
  let h='<div class="week" aria-label="Semaine en cours">';
  for(let i=0;i<7;i++){
    const kk=addDays(mon,i), di=dayInfo(kk);
    const cls = kk>k ? (di.frozen?'frozen future':'future') : (di.full?'full':(di.frozen?'frozen':(di.part?'part':'')));
    h+=`<div class="wd ${cls} ${kk===k?'today':''}"><i></i>${DOW[parseKey(kk).getDay()]}</div>`;
  }
  return h+'</div>';
}
function taskHTML(t,k){

    <span class="fill"></span><span class="ico">${icon(t.icon)}</span>
    <span class="txt"><span class="name">${esc(t.name)}</span><span class="sub">${sub}</span></span>
    <span class="check">${I.check}</span></button>`;
}

let sheetEl=null, scrimEl=null;
function openSheet(html){
  closeSheet(true);
  scrimEl=document.createElement('div'); scrimEl.className='scrim'; scrimEl.dataset.act='closeSheet';
  sheetEl=document.createElement('div'); sheetEl.className='sheet'; sheetEl.setAttribute('role','dialog'); sheetEl.setAttribute('aria-modal','true');
  sheetEl.innerHTML=`<div class="sheet-in"><div class="grab"></div>${html}</div>`;
  document.body.append(scrimEl,sheetEl);
  requestAnimationFrame(()=>{ scrimEl.classList.add('open'); sheetEl.classList.add('open'); });
}
function setSheet(html){ if(sheetEl) sheetEl.querySelector('.sheet-in').innerHTML=`<div class="grab"></div>${html}`; }
function closeSheet(now){
  const s=sheetEl, c=scrimEl; sheetEl=scrimEl=null;
  if(!s) return;
  if(now){ s.remove(); c.remove(); return; }
  s.classList.remove('open'); c.classList.remove('open');
  setTimeout(()=>{ s.remove(); c.remove(); },320);
}

    <div class="section"><span class="label">Sauvegarde</span>
      <p class="muted" style="margin:0;font-size:13.5px">Tes données restent sur ce téléphone. Copie ta sauvegarde de temps en temps (les photos n'y sont pas).</p>
      <div class="row"><button class="btn small ghost" data-act="exportData">Copier ma sauvegarde</button><button class="btn small ghost" data-act="importOpen">Restaurer</button></div>
      <div id="ioZone"></div></div>
    <div class="section"><span class="label">Installer sur ton téléphone</span>
      <p class="muted" style="margin:0;font-size:13.5px">iPhone : bouton Partager de Safari, puis « Sur l'écran d'accueil ». Android : menu ⋮ de Chrome, puis « Installer l'application ».</p></div>
    <button class="btn danger block" data-act="askReset">Tout effacer</button><div id="resetZone"></div>`;
}

function confirmBox(text,act,label){
  return `<div class="confirm"><strong>${text}</strong><div class="row"><button class="btn small danger" data-act="${act}">${label}</button><button class="btn small ghost" data-act="cancelConfirm">Annuler</button></div></div>`;
}

function dayHTML(k){
  const fut = k>todayKey();
  const tasks=tasksFor(k).length? tasksFor(k) : [];
  const L=S.log[k];
  const req = (L&&L.req)? L.req : tasks.map(t=>t.key);
  const all = req.map(key=>tasks.find(t=>t.key===key) || nameFromKey(key,k)).filter(Boolean);
  return `<div class="row"><h2>${niceDate(k)}</h2><span class="spacer"></span><button class="btn small ghost" data-act="closeSheet">Fermer</button></div>
    ${gelBox(k)}
    ${fut?'':`<p class="muted" style="margin:0">${inArc(k)?'Jour '+arcDay(k)+' · ':''}coche ce que tu as fait.</p>
    <div class="tasks">${all.map(t=>taskHTML(t,k).replace('data-act="toggle"',`data-act="toggleDay" data-k="${k}"`)).join('')||'<p class="muted">Rien à cocher ce jour-là.</p>'}</div>`}`;
}
function gelBox(k){
  const d=dayInfo(k), left=gelsLeft();
  if(d.full) return '';
  if(d.frozen) return `<div class="card gel-card"><strong>❄️ Ce jour est gelé</strong><p class="muted" style="margin:0;font-size:13.5px">Ta série continue même si tu n'as pas tout fait.</p><button class="btn small ghost" data-act="unfreeze" data-k="${k}" style="align-self:flex-start">Retirer le gel</button></div>`;
  return `<div class="card gel-card"><strong>Gels disponibles : ${left}</strong>
    <p class="muted" style="margin:0;font-size:13.5px">${left?'Gèle ce jour pour protéger ta série.':'Fais 10 jours complets d\'affilée pour gagner un gel.'}</p>
    ${left?`<button class="btn small" data-act="freeze" data-k="${k}" style="align-self:flex-start">❄️ Geler ce jour</button>`:''}</div>`;
}
function nameFromKey(key,k){
  const [t,id]=key.split(':');
  if(t==='r'){ const r=S.arc&&S.arc.rules.find(x=>x.id===id); return r?{key,name:r.name,icon:r.icon,color:r.color,kind:'rule'}:null; }
  const c=S.challenges.find(x=>x.id===id); return c?{key,name:c.name,icon:c.icon,color:c.color,kind:'ch',day:c.start?diffDays(c.start,k)+1:0}:null;
}

/* ---------- Actions ---------- */
let pendingProgram=null;
document.addEventListener('click', async (ev)=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id;
  switch(act){
    case 'tab': tab=id; closeSheet(true); render(); window.scrollTo({top:0}); break;
    case 'defisTab': defisTab=id; render(); break;
    case 'settings': openSheet(settingsHTML()); break;
    case 'closeSheet': closeSheet(); if(tab!=='today') render(); else { app.innerHTML=viewToday(); requestAnimationFrame(updateHero);} break;
    case 'toggle': toggleTask(el,ev,todayKey()); break;
    case 'toggleDay': toggleTask(el,ev,el.dataset.k,true); break;
    case 'theme': S.theme=el.dataset.v; save(); applyTheme(); setSheet(settingsHTML()); break;
    case 'tgl': S[el.dataset.v]=!S[el.dataset.v]; save(); el.setAttribute('aria-checked',S[el.dataset.v]); break;
    case 'photo': document.getElementById('photoInput').click(); break;
    case 'day': openSheet(dayHTML(el.dataset.k)); break;

    case 'pickProgram': {
      const p=S.programs.find(x=>x.id===id); if(!p) break;
      openSheet(`<h2>${esc(p.emoji)} ${esc(p.name)}</h2>${p.desc?`<p class="muted" style="margin:0">${esc(p.desc)}</p>`:''}
        <div class="chips">${p.rules.map(r=>`<span class="chip">${icon(r.icon)} ${esc(r.name)}</span>`).join('')||'<span class="muted">Aucune règle</span>'}</div>
        <p class="muted" style="margin:0;font-size:13.5px">${p.days||90} jours. Tu pourras modifier toutes les règles ensuite.${S.arc?' Il remplace ton défi actuel ('+esc(S.arc.name)+').':''}</p>
        <button class="btn block" data-act="startProgram" data-id="${p.id}" ${p.rules.length?'':'disabled'}>Commencer aujourd'hui</button>
        <button class="btn ghost block" data-act="editProg" data-id="${p.id}">Modifier</button>`);
      break; }
    case 'progMenu': {
      const p=S.programs.find(x=>x.id===id); if(!p) break;
      openSheet(`<h2>${esc(p.emoji)} ${esc(p.name)}</h2>
        <button class="btn block" data-act="startProgram" data-id="${p.id}" ${p.rules.length?'':'disabled'}>Commencer aujourd'hui</button>
        <button class="btn ghost block" data-act="editProg" data-id="${p.id}">Modifier (nom, icône, règles)</button>
        <button class="btn danger block" data-act="askDelProg" data-id="${p.id}">Supprimer le programme</button><div id="delProgZone"></div>`);
      break; }
    case 'askDelProg': document.getElementById('delProgZone').innerHTML=confirmBox('Supprimer ce programme ? Ton défi en cours n\'est pas touché.','doDelProg" data-id="'+id,'Supprimer'); break;
    case 'doDelProg': S.programs=S.programs.filter(x=>x.id!==id); save(); closeSheet(); render(); toast('Programme supprimé'); break;
    case 'editProg': editTarget=id; openSheet(arcEditorHTML()); break;
    case 'startProgram': {
      const p=S.programs.find(x=>x.id===id); if(!p||!p.rules.length) break;
      if(S.arc) S.pastArcs.push({...S.arc, endedOn:todayKey()});
      S.arc=arcFromProgram(p);
      save(); closeSheet(true); tab='today'; render(); toast(p.name+' lancé. Jour 1 !'); break; }
    case 'customArc': {
      const p={id:uid(),name:'Mon programme',emoji:'🎯',color:'#3b82f6',desc:'',days:90,rules:[]};
      S.programs.push(p); save(); render(); editTarget=p.id; openSheet(arcEditorHTML()); break; }
    case 'askStopArc': document.getElementById('stopArcZone').innerHTML=confirmBox('Arrêter '+esc(S.arc.name)+' ? Les défis de 30 jours continuent.','doStopArc','Arrêter le défi'); break;
    case 'doStopArc': S.pastArcs.push({...S.arc,endedOn:todayKey()}); S.arc=null; save(); closeSheet(true); render(); toast('Défi arrêté'); break;
    case 'editArc': editTarget='arc'; openSheet(arcEditorHTML()); break;
    case 'arcColor': { const a=tgt(); readArcMeta(a); a.color=el.dataset.v; save(); setSheet(arcEditorHTML()); render(); break; }
    case 'saveArcMeta': { readArcMeta(tgt()); save(); toast('Enregistré'); setSheet(arcEditorHTML()); render(); break; }
    case 'mvRule': {
      const r=tgt().rules, i=r.findIndex(x=>x.id===id), j=i+(+el.dataset.d);
      if(j<0||j>=r.length) break; [r[i],r[j]]=[r[j],r[i]]; save(); setSheet(arcEditorHTML()); render(); break; }
    case 'askRestart': document.getElementById('restartZone').innerHTML=confirmBox('Repartir au jour 1 ?','doRestart','Oui, recommencer'); break;
    case 'doRestart': S.arc.start=todayKey(); save(); closeSheet(); tab='today'; render(); toast('C\'est reparti. Jour 1.'); break;
    case 'newRule': readArcMeta(tgt()); draft={kind:'rule',title:'Nouvelle règle',name:'',icon:'🎯',color:'#3b82f6'}; setSheet(editorHTML()); break;
    case 'editRule': { const r=tgt().rules.find(x=>x.id===id); draft={kind:'rule',title:'Modifier la règle',id:r.id,name:r.name,icon:r.icon,color:r.color}; setSheet(editorHTML()); break; }

    case 'newCh': draft={kind:'ch',title:'Nouveau défi 30 jours',name:'',desc:'',icon:'💪',color:'#ef4444'}; openSheet(editorHTML()); break;
    case 'chMenu': {
      const c=S.challenges.find(x=>x.id===id); if(!c) break; const on=chActive(c,todayKey());
      openSheet(`<div class="row"><span class="ico-sm" style="--c:${c.color}">${icon(c.icon)}</span><h2>${esc(c.name)}</h2></div>
        ${on?'':`<button class="btn block" data-act="startCh" data-id="${c.id}">Commencer aujourd'hui</button>`}
        <button class="btn ghost block" data-act="editCh" data-id="${c.id}">Modifier (nom, image, couleur)</button>
        ${on?`<button class="btn ghost block" data-act="askStopChSheet" data-id="${c.id}">Arrêter le défi</button><div id="stopChSheet"></div>`:''}
        <button class="btn danger block" data-act="askDelCh" data-id="${c.id}">Supprimer le défi</button><div id="delChZone"></div>`);
      break; }
    case 'askDelCh': document.getElementById('delChZone').innerHTML=confirmBox('Supprimer ce défi pour de bon ?','doDelCh" data-id="'+id,'Supprimer'); break;
    case 'doDelCh': S.challenges=S.challenges.filter(x=>x.id!==id); save(); closeSheet(); render(); toast('Défi supprimé'); break;
    case 'editCh': { const c=S.challenges.find(x=>x.id===id); draft={kind:'ch',title:'Modifier le défi',id:c.id,name:c.name,desc:c.desc,icon:c.icon,color:c.color}; openSheet(editorHTML()); break; }
    case 'startCh': { const c=S.challenges.find(x=>x.id===id); c.start=todayKey(); save(); closeSheet(true); render(); toast(c.name+' : jour 1/30'); buzz(20); break; }
    case 'askStopCh': document.getElementById('stopCh-'+id).innerHTML=confirmBox('Arrêter ce défi ?','doStopCh" data-id="'+id,'Arrêter'); break;
    case 'askStopChSheet': document.getElementById('stopChSheet').innerHTML=confirmBox('Arrêter ce défi ?','doStopCh" data-id="'+id,'Arrêter'); break;
    case 'doStopCh': { const c=S.challenges.find(x=>x.id===id); if(c) c.start=null; save(); closeSheet(true); render(); toast('Défi arrêté'); break; }

    case 'pickEmoji': readDraftInputs(); draft.icon=el.dataset.v; setSheet(editorHTML()); break;
    case 'pickColor': readDraftInputs(); draft.color=el.dataset.v; setSheet(editorHTML()); break;
    case 'pickImage': readDraftInputs(); document.getElementById('iconInput').click(); break;
    case 'saveDraft': {
      readDraftInputs();
      if(!draft.name.trim()){ toast('Donne un nom à la tâche'); break; }
      if(draft.kind==='rule'){
        const rs=tgt().rules;
        if(draft.id){ Object.assign(rs.find(x=>x.id===draft.id),{name:draft.name.trim(),icon:draft.icon,color:draft.color}); }
        else rs.push({id:uid(),name:draft.name.trim(),icon:draft.icon,color:draft.color});
        save(); setSheet(arcEditorHTML()); render();
      } else {
        if(draft.id){ Object.assign(S.challenges.find(x=>x.id===draft.id),{name:draft.name.trim(),desc:draft.desc.trim(),icon:draft.icon,color:draft.color}); }
        else S.challenges.unshift({id:uid(),name:draft.name.trim(),desc:draft.desc.trim(),icon:draft.icon,color:draft.color,start:null});
        save(); closeSheet(); render();
      }
      toast('Enregistré'); break; }
    case 'askDelete': readDraftInputs(); document.getElementById('delZone').innerHTML=confirmBox('Supprimer pour de bon ?','doDelete','Supprimer'); break;
    case 'doDelete':
      if(draft.kind==='rule'){ const t=tgt(); t.rules=t.rules.filter(x=>x.id!==draft.id); save(); setSheet(arcEditorHTML()); render(); }
      else { S.challenges=S.challenges.filter(x=>x.id!==draft.id); save(); closeSheet(); render(); }
      toast('Supprimé'); break;
    case 'cancelConfirm': el.closest('.confirm').remove(); break;

    case 'freeze': { S.frozen[el.dataset.k]=1; save(); setSheet(dayHTML(el.dataset.k)); render(); toast('❄️ Jour gelé, ta série est protégée'); buzz(20); break; }
    case 'unfreeze': { delete S.frozen[el.dataset.k]; save(); setSheet(dayHTML(el.dataset.k)); render(); toast('Gel retiré, il revient dans ta réserve'); break; }

    case 'exportData': {
      const txt=JSON.stringify(S);
      try{ await navigator.clipboard.writeText(txt); toast('Sauvegarde copiée. Colle-la dans tes notes.'); }
      catch(e){ document.getElementById('ioZone').innerHTML=`<div class="field"><label class="label" for="io-out">Sélectionne et copie ce texte</label><textarea id="io-out" readonly>${esc(txt)}</textarea></div>`; const t=document.getElementById('io-out'); t.focus(); t.select(); }
      break; }
    case 'importOpen': document.getElementById('ioZone').innerHTML=`<div class="field"><label class="label" for="io-in">Colle ta sauvegarde ici</label><textarea id="io-in"></textarea></div><button class="btn small" data-act="importDo">Restaurer</button>`; break;
    case 'importDo': {
      try{ const o=JSON.parse(document.getElementById('io-in').value); if(!o||o.v!==1||!o.log) throw 0; S=o; save(); applyTheme(); closeSheet(); render(); toast('Sauvegarde restaurée'); }
      catch(e){ toast('Ce texte n\'est pas une sauvegarde valide'); }
      break; }
    case 'askReset': document.getElementById('resetZone').innerHTML=confirmBox('Effacer toutes tes données ?','doReset','Tout effacer'); break;
    case 'doReset': S=freshState(); save(); applyTheme(); closeSheet(); tab='today'; render(); toast('Données effacées'); break;
  }
});

function toggleTask(el,ev,k,fromSheet){
  const key=el.dataset.key, now=!isDone(k,key);
  const r=el.getBoundingClientRect();
  const x = ev.clientX ? ev.clientX - r.left : r.width*.9, y = ev.clientY ? ev.clientY - r.top : r.height/2;
  el.style.setProperty('--x', x+'px'); el.style.setProperty('--y', y+'px');
  const wasFull = dayInfo(k).full, g0 = earnedGels();
  setDone(k,key,now);
  el.classList.toggle('done',now); el.setAttribute('aria-pressed',now);
  el.classList.remove('pop','shine'); void el.offsetWidth;
  if(now){
    el.classList.add('pop','shine');
    shards(ev.clientX || r.right-30, ev.clientY || r.top+r.height/2, getComputedStyle(el).getPropertyValue('--c').trim());
    buzz(18); tink(true);
  } else { buzz(8); tink(false); }
  if(!fromSheet) updateHero();
  const g1 = earnedGels();
  if(!wasFull && dayInfo(k).full && k===todayKey()) setTimeout(()=>celebrate(g1>g0), 650);
  else if(g1>g0) toast('❄️ +1 gel de série gagné');
}

document.getElementById('iconInput').addEventListener('change', async (e)=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f||!draft) return;
  try{
    const url=URL.createObjectURL(f); const img=new Image();
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; });
    const S2=192, c=document.createElement('canvas'); c.width=c.height=S2;
    const m=Math.min(img.width,img.height), sx=(img.width-m)/2, sy=(img.height-m)/2;
    c.getContext('2d').drawImage(img,sx,sy,m,m,0,0,S2,S2); URL.revokeObjectURL(url);
    draft.icon=c.toDataURL('image/jpeg',.8); setSheet(editorHTML()); toast('Image ajoutée. Pense à enregistrer.');
  }catch(err){ toast('Impossible de lire cette image'); }
});
document.getElementById('photoInput').addEventListener('change', async (e)=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f||!S.arc) return;
  try{
    const url=URL.createObjectURL(f); const img=new Image();
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; });
    const max=1000, sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
    const data=c.toDataURL('image/jpeg',.82), k=todayKey();
    await putPhoto(S.arc.id+':'+k, data);
    (S.log[k]||(S.log[k]={done:{}})).photo=1; save();
    render(); toast('Photo rangée. Rendez-vous au jour '+S.arc.days+'.'); buzz(20);
  }catch(err){ toast('Impossible de lire cette photo'); }
});

document.addEventListener('visibilitychange',()=>{ if(!document.hidden && tab==='today'){ render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && sheetEl){ closeSheet(); render(); } });

// Hors connexion (seulement quand l'appli est hébergée normalement)
if('serviceWorker' in navigator && location.protocol==='https:' && !/claude|anthropic|usercontent/.test(location.hostname)){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

load(); applyTheme(); render();
})();
</script>
